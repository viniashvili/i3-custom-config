[colors]
background = #252c3d
foreground = #c4ccda
pill = #aab5c8
pill-text = #354055
system = #414b63
accent = #7e8da9
urgent = #d47c8a

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 24
bottom = false
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

font-0 = Noto Sans:size=9;2
font-1 = DejaVu Sans:size=10;2
font-2 = Symbola:size=11;2

padding-left = 1
padding-right = 1
module-margin = 1
separator =

modules-left = logo
modules-center = i3
modules-right = cpu memory network volume scratchpad date power

enable-ipc = true
cursor-click = pointer

[module/logo]
type = custom/text
format = " ▲ "
format-foreground = ${colors.foreground}
click-left = rofi -show drun

[module/i3]
type = internal/i3
pin-workspaces = true
enable-click = true
enable-scroll = true
index-sort = true

format = <label-state>
format-background = ${colors.pill}
format-foreground = ${colors.pill-text}
format-padding = 1

label-focused = ●
label-focused-foreground = ${colors.pill-text}
label-focused-padding = 1

label-unfocused = ◉
label-unfocused-foreground = ${colors.accent}
label-unfocused-padding = 1

label-visible = ◉
label-visible-foreground = ${colors.accent}
label-visible-padding = 1

label-urgent = ●
label-urgent-foreground = ${colors.urgent}
label-urgent-padding = 1

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-background = ${colors.system}
format-padding = 1
label = CPU %percentage%%

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-background = ${colors.system}
format-padding = 1
label = RAM %percentage_used%%

[module/network]
type = custom/script
exec = ~/.config/polybar/network.sh
interval = 10
format = <label>
format-background = ${colors.system}
format-padding = 1

[module/volume]
type = internal/pulseaudio
format-volume = <label-volume>
format-volume-background = ${colors.pill}
format-volume-foreground = ${colors.pill-text}
format-volume-padding = 2
label-volume = VOL %percentage%%

format-muted = <label-muted>
format-muted-background = ${colors.pill}
format-muted-foreground = ${colors.pill-text}
format-muted-padding = 2
label-muted = MUTED

[module/date]
type = internal/date
interval = 1
date = %d/%m/%Y
time = %H:%M
label = %date%  %time%

format = <label>
format-background = ${colors.pill}
format-foreground = ${colors.pill-text}
format-padding = 2

[module/power]
type = custom/text
click-left = /home/vano-iniashvili/.config/i3/scripts/powermenu
format = " ⏻ "
format-foreground = ${colors.urgent}

[settings]
screenchange-reload = true

[module/scratchpad]
type = custom/script
exec = python3 ~/.config/polybar/scratchpad.py
interval = 1
format = <label>
format-foreground = #f9e2af
