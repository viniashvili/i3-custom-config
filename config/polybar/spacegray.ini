; Spacegray visual theme. Generated from config.ini; original modules preserved.
[colors]
background = #2B303B
foreground = #C0C5CE
pill = #C0C5CE
pill-text = #354055
system = #4A5266
accent = #8FA1B3
urgent = #d47c8a
muted = #65737E
panel = #4A5266
pill_fg = #4A5266
red = #BF616A
[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 20
bottom = false
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

font-0 = DejaVu Sans Mono:size=8;2
font-1 = Symbols Nerd Font Mono:size=12;2
font-2 = Noto Sans:size=8;2

padding-left = 1
padding-right = 1
module-margin = 0
separator = 

modules-left = sg-logo
modules-center = xwindow
modules-right = scratchpad date sg-power

enable-ipc = true
cursor-click = pointer
radius = 0
border-size = 2
border-color = ${colors.background}
font-3 = Symbols Nerd Font Mono:size=9;2
font-4 = Symbols Nerd Font Mono:pixelsize=11;2
[module/logo]
type = custom/text
format = " ▲ "
format-foreground = ${colors.foreground}
click-left = rofi -show drun

[module/i3]
type = internal/i3
pin-workspaces = true
enable-click = true
enable-scroll = true
index-sort = true

format = <label-state>
format-background = ${colors.pill}
format-foreground = ${colors.pill-text}
format-padding = 1

label-focused = ●
label-focused-foreground = ${colors.pill_fg}
label-focused-padding = 1

label-unfocused = ◎
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 1

label-visible = ◉
label-visible-foreground = ${colors.accent}
label-visible-padding = 1

label-urgent = ●
label-urgent-foreground = ${colors.red}
label-urgent-padding = 1
label-focused-background = ${colors.pill}
label-unfocused-background = ${colors.pill}
label-visible-background = ${colors.pill}
label-urgent-background = ${colors.pill}
[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-background = ${colors.panel}
format-padding = 0
label = CPU %percentage%%
format-foreground = ${colors.foreground}
format-prefix = 
[module/memory]
type = internal/memory
interval = 2
format = <label>
format-background = ${colors.panel}
format-padding = 0
label = RAM %percentage_used%%
format-foreground = ${colors.foreground}
format-prefix = 
[module/network]
type = custom/script
exec = ~/.config/polybar/network.sh
interval = 10
format = <label>
format-background = ${colors.panel}
format-padding = 1
format-foreground = ${colors.foreground}
[module/volume]
type = internal/pulseaudio
format-volume = <label-volume>
format-volume-background = ${colors.pill}
format-volume-foreground = ${colors.pill_fg}
format-volume-padding = 0
label-volume = %{T4}%{T-} %percentage%%

format-muted = <label-muted>
format-muted-background = ${colors.pill}
format-muted-foreground = ${colors.pill_fg}
format-muted-padding = 0
label-muted = MUTED

[module/date]
type = internal/date
interval = 1
date = %d/%m/%Y
time = %H:%M
label = %date%  %time%

format = <label>
format-foreground = ${colors.foreground}
format-padding = 0

format-margin = 20px
[module/power]
type = custom/text
click-left = /home/vano-iniashvili/.config/i3/scripts/powermenu
format = " ⏻ "
format-foreground = ${colors.urgent}

[settings]
screenchange-reload = true

[module/scratchpad]
type = custom/script
exec = python3 ~/.config/polybar/scratchpad.py
interval = 1
format = <label>
format-foreground = ${colors.foreground}
format-background = ${colors.panel}
format-padding = 0

[module/sg-workspace-left]
type = custom/text
label = 
label-font = 2
label-background = ${colors.background}
label-foreground = ${colors.pill}

[module/sg-workspace-right]
type = custom/text
label = 
label-font = 2
label-background = ${colors.background}
label-foreground = ${colors.pill}

[module/sg-system-left]
type = custom/text
label = 
label-font = 5
label-background = ${colors.background}
label-foreground = ${colors.panel}

[module/sg-system-right]
type = custom/text
label = 
label-font = 5
label-background = ${colors.background}
label-foreground = ${colors.panel}

[module/sg-volume-left]
type = custom/text
label = 
label-font = 5
label-background = ${colors.background}
label-foreground = ${colors.pill}

[module/sg-volume-right]
type = custom/text
label = 
label-font = 5
label-background = ${colors.background}
label-foreground = ${colors.pill}

[module/sg-date-left]
type = custom/text
label = 
label-font = 5
label-background = ${colors.background}
label-foreground = ${colors.pill}

[module/sg-date-right]
type = custom/text
label = 
label-font = 5
label-background = ${colors.background}
label-foreground = ${colors.pill}

[module/sg-gap]
type = custom/text
label = "  "

[module/sg-logo]
type = custom/text
label = 
label-font = 4
label-foreground = ${colors.foreground}
click-left = rofi -show drun
format-font = 4
[module/sg-power]
type = custom/text
label = 
label-font = 4
label-foreground = ${colors.red}
click-left = /home/vano-iniashvili/.config/i3/scripts/powermenu
format-font = 4

[module/xwindow]
type = internal/xwindow
format = <label>
format-background = ${colors.background}
format-padding = 0
label = %title:0:45:...%
label-empty =
label-foreground = ${colors.foreground}
label-font = 1
